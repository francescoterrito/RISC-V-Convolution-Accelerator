<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Tiled convolution accelerator integrated into the Croc RISC-V MCU</title>
  <desc id="desc">Croc CPU connects through OBI address decoding to the accelerator scratchpad and control registers. The core uses four multipliers, an adder tree, an accumulator, and a 128 by 32-bit SRAM. Firmware schedules four by two by twelve tiles and receives completion interrupt one.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16263d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#83a6c9"/>
    </marker>
    <style>
      .title{font:700 30px Inter,Arial,sans-serif;fill:#f7fbff}.subtitle{font:500 15px Inter,Arial,sans-serif;fill:#9bb1c8}
      .box{fill:#17263a;stroke:#55708e;stroke-width:2}.accent{fill:#122e3b;stroke:#31b7d5;stroke-width:2.5}.violet{fill:#26233e;stroke:#9a82e8;stroke-width:2.5}
      .label{font:700 18px Inter,Arial,sans-serif;fill:#f2f7fb;text-anchor:middle}.small{font:500 13px Inter,Arial,sans-serif;fill:#afc1d4;text-anchor:middle}
      .tiny{font:500 12px Inter,Arial,sans-serif;fill:#8fa8c0;text-anchor:middle}.line{stroke:#83a6c9;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="600" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Tiled 1D convolution accelerator</text>
  <text x="60" y="86" class="subtitle">Standalone RTL verification and Croc MCU integration in one design flow</text>

  <g filter="url(#shadow)">
    <rect x="55" y="160" width="180" height="126" rx="16" class="violet"/>
    <text x="145" y="206" class="label">Croc MCU</text>
    <text x="145" y="233" class="small">CVE2 RISC-V core</text>
    <text x="145" y="258" class="tiny">firmware tile scheduler</text>

    <rect x="305" y="160" width="180" height="126" rx="16" class="box"/>
    <text x="395" y="202" class="label">User-domain OBI</text>
    <text x="395" y="231" class="small">address decode</text>
    <text x="395" y="256" class="tiny">scratchpad + CSR windows</text>

    <rect x="555" y="120" width="220" height="86" rx="15" class="violet"/>
    <text x="665" y="153" class="label">Control registers</text>
    <text x="665" y="180" class="small">start / accumulate / status</text>

    <rect x="555" y="240" width="220" height="126" rx="16" class="accent"/>
    <text x="665" y="278" class="label">Convolution core</text>
    <text x="665" y="307" class="small">4 signed multipliers</text>
    <text x="665" y="332" class="small">3-adder tree + accumulator</text>

    <rect x="845" y="240" width="260" height="126" rx="16" class="accent"/>
    <text x="975" y="278" class="label">128 x 32-bit SRAM</text>
    <text x="975" y="307" class="small">64 input + 40 weight</text>
    <text x="975" y="332" class="small">+ 24 output words</text>
  </g>

  <path d="M235 223 H305" class="line"/>
  <path d="M485 202 H555" class="line"/>
  <path d="M485 248 C520 248 520 303 555 303" class="line"/>
  <path d="M775 303 H845" class="line"/>
  <path d="M665 206 V240" class="line"/>
  <path d="M665 366 C665 420 240 420 240 286" class="line"/>
  <text x="438" y="443" class="small">completion interrupt 1</text>

  <rect x="55" y="490" width="1050" height="68" rx="14" fill="#101b2a" stroke="#324a64" stroke-width="1.5"/>
  <text x="580" y="518" class="label">Tile: Cin 4 x Cout 2 x T 12 x K 5</text>
  <text x="580" y="544" class="small">Full workload: 4 output tiles x 11 time tiles x 4 input tiles = 176 accelerator runs</text>
</svg>
